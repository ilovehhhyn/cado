[project]
name = "tplane"
version = "0.1.0"
description = "Typed outcome records and failure policy for RL rollouts and train steps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
gpu = ["nvidia-ml-py==13.610.43"]
parquet = ["pyarrow==25.0.1"]
frameworks = ["verifiers==0.3.1"]
dev = ["mypy==2.3.1", "pyarrow==25.0.1", "pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
tp = "tplane.cli.main:run"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
pythonpath = ["."]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Research scripts run once on Della against RFT-FaultBench; they are kept for reproduction, not as package code.
extend-exclude = ["scripts/rft_faultbench"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
# The formatter owns line length; long message strings stay whole so they can be searched.
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "tests", "tplane"]
